# Docker Compose for local development
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ambersand-db
    environment:
      POSTGRES_DB: ambersand
      POSTGRES_USER: ambersand_user
      POSTGRES_PASSWORD: ambersand_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./drizzle:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambersand_user -d ambersand"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ambersand-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ambersand-app
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://ambersand_user:ambersand_password@postgres:5432/ambersand
      APP_BASE_URL: http://localhost:5000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your-jwt-access-secret-min-64-chars-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-jwt-refresh-secret-min-64-chars-change-in-production}
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-change-in-production}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-sendgrid}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-no-reply@example.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Ambersand}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ambersand-network
    restart: unless-stopped

  # Nginx reverse proxy (optional for local dev)
  nginx:
    image: nginx:alpine
    container_name: ambersand-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - ambersand-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  ambersand-network:
    driver: bridge
